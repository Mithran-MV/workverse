# Render blueprint. Heroku's free tier - which the Procfile in this repository was
# written for - no longer exists, so this is the equivalent for a platform that still
# has one.
services:
  - type: web
    name: workverse-server
    runtime: node
    plan: free
    rootDir: workverse
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: CORS_ORIGINS
        sync: false
      - key: COLYSEUS_MONITOR
        value: 'false'

  - type: web
    name: workverse-client
    runtime: static
    rootDir: workverse/client
    buildCommand: npm ci && npx vite build
    staticPublishPath: ./dist
    envVars:
      # must point at the wss:// URL of the server service above
      - key: VITE_SERVER_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
